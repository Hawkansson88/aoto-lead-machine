<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AOTO Lead Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy-900:#0d1424; --navy-800:#131e35; --navy-700:#1b2945; --navy-600:#243557;
  --canvas:#f3f5f8; --surface:#ffffff; --surface-2:#fafbfc;
  --ink:#14202e; --muted:#69748a; --faint:#9aa6b8; --line:#e6eaf0;
  --accent:#00b388; --accent-2:#06caa0; --accent-soft:rgba(0,179,136,.12);
  --hot:#ff7a45; --hot-soft:rgba(255,122,69,.14);
  --st-ny:#5b6b85; --st-kontaktad:#cf8a12; --st-mote:#0f9d6f; --st-ej:#9aa6b8;
  --sc-low:#e0556b; --sc-mid:#e0a23a; --sc-high:#11a37a;
  --shadow:0 18px 50px -20px rgba(13,20,36,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  background:var(--canvas); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
.num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- Layout shell ---------- */
.app{display:none; grid-template-columns:288px 1fr; height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  background:linear-gradient(178deg,var(--navy-800),var(--navy-900) 70%);
  color:#dce4f1; padding:22px 20px; overflow-y:auto; position:relative;
  border-right:1px solid rgba(255,255,255,.04);
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}
.brand{display:flex; align-items:center; gap:11px; margin-bottom:26px}
.brand .mark{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  font-family:'Archivo';font-weight:800;color:#06241c;font-size:19px;
  box-shadow:0 6px 18px -6px var(--accent);
}
.brand .wm{font-family:'Archivo';font-weight:800;font-size:18px;letter-spacing:-.4px;line-height:1;color:#fff}
.brand .wm small{display:block;font-family:'IBM Plex Sans';font-weight:500;font-size:10.5px;letter-spacing:1.4px;color:var(--accent-2);margin-top:3px;text-transform:uppercase}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:24px}
.stat{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  border-radius:12px;padding:12px 13px;position:relative;overflow:hidden;
}
.stat .v{font-family:'Archivo';font-weight:800;font-size:25px;line-height:1;letter-spacing:-.5px}
.stat .l{font-size:10.5px;color:#9fb0cc;margin-top:6px;letter-spacing:.3px}
.stat.mote .v{color:var(--st-mote)} .stat.hot .v{color:var(--hot)} .stat.followup .v{color:var(--accent-2)} .stat.untouched .v{color:#c4cee0}
.stat .spark{position:absolute;right:-6px;top:-6px;font-size:34px;opacity:.10}

.section-label{font-size:10.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:#7f8eaa;margin:0 0 11px 2px}

.status-list{display:flex;flex-direction:column;gap:4px;margin-bottom:24px}
.status-item{
  display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;
  cursor:pointer;font-size:13.5px;color:#c4cee0;transition:.14s;border:1px solid transparent;
}
.status-item:hover{background:rgba(255,255,255,.05)}
.status-item.active{background:rgba(0,179,136,.13);border-color:rgba(0,179,136,.32);color:#fff}
.status-item .dot{width:9px;height:9px;border-radius:50%;flex:none}
.status-item .cnt{margin-left:auto;font-size:11.5px;color:#8595b3;font-family:'IBM Plex Mono'}

.slider-wrap{margin-bottom:24px}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.slider-head b{font-family:'Archivo';font-size:16px;color:var(--accent-2)}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:5px;
  background:linear-gradient(90deg,var(--accent) var(--p,0%),rgba(255,255,255,.12) var(--p,0%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{
  display:flex;align-items:center;gap:16px;padding:18px 28px;background:var(--surface);
  border-bottom:1px solid var(--line);flex:none;
}
.topbar h1{font-family:'Archivo';font-weight:700;font-size:20px;margin:0;letter-spacing:-.4px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.search{margin-left:auto;position:relative}
.search input{
  width:280px;padding:9px 14px 9px 36px;border:1px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:13.5px;background:var(--surface-2);transition:.15s;
}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px}
.conn-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:5px 10px;border-radius:20px;letter-spacing:.2px}
.conn-pill.live{background:var(--accent-soft);color:#0a7a5c}
.conn-pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}

.table-scroll{overflow-y:auto;flex:1;padding:8px 28px 40px}
.table-scroll::-webkit-scrollbar{width:10px}
.table-scroll::-webkit-scrollbar-thumb{background:#d3d9e2;border-radius:8px;border:3px solid var(--canvas)}
table{width:100%;border-collapse:separate;border-spacing:0 7px}
thead th{
  position:sticky;top:0;background:var(--canvas);z-index:2;text-align:left;
  font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
  padding:6px 14px;cursor:pointer;user-select:none;white-space:nowrap;
}
thead th:hover{color:var(--ink)}
thead th .ar{font-size:9px;color:var(--accent);margin-left:4px}
thead th.right{text-align:right}
tbody tr{background:var(--surface);cursor:pointer;transition:.12s;box-shadow:0 1px 2px rgba(13,20,36,.04)}
tbody tr:hover{transform:translateY(-1px);box-shadow:0 6px 18px -8px rgba(13,20,36,.22)}
tbody tr.sel{box-shadow:0 0 0 2px var(--accent),0 6px 18px -8px rgba(0,179,136,.4)}
tbody td{padding:13px 14px;font-size:13.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody td:first-child{border-left:1px solid var(--line);border-radius:11px 0 0 11px}
tbody td:last-child{border-right:1px solid var(--line);border-radius:0 11px 11px 0}
td.right{text-align:right}
.co-name{font-weight:600}
.co-org{font-size:11px;color:var(--faint);margin-top:2px}

.score-cell{display:flex;align-items:center;gap:10px;min-width:118px}
.score-num{font-family:'Archivo';font-weight:800;font-size:16px;width:26px;flex:none}
.score-bar{flex:1;height:7px;border-radius:7px;background:#eef1f5;overflow:hidden}
.score-fill{height:100%;border-radius:7px}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:5px 10px;border-radius:7px}
.badge .dot{width:7px;height:7px;border-radius:50%}
.b-ny{background:#eef1f6;color:var(--st-ny)} .b-ny .dot{background:var(--st-ny)}
.b-kontaktad{background:#fbf1dd;color:var(--st-kontaktad)} .b-kontaktad .dot{background:var(--st-kontaktad)}
.b-mote{background:#e3f6ee;color:var(--st-mote)} .b-mote .dot{background:var(--st-mote)}
.b-ejaktuell{background:#f1f3f6;color:var(--st-ej)} .b-ejaktuell .dot{background:var(--st-ej)}

.fu-late{color:var(--sc-low);font-weight:600}
.fu-today{color:var(--hot);font-weight:600}
.fu-future{color:var(--muted)}
.fu-none{color:var(--faint)}

.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}

/* ---------- Detail panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(13,20,36,.34);opacity:0;pointer-events:none;transition:.22s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.panel{
  position:fixed;top:0;right:0;height:100vh;width:440px;max-width:92vw;background:var(--surface);
  box-shadow:var(--shadow);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,.0,.2,1);
  z-index:50;display:flex;flex-direction:column;
}
.panel.open{transform:translateX(0)}
.p-head{padding:24px 26px 20px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.p-close{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:#fff;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.p-close:hover{background:var(--canvas);color:var(--ink)}
.p-score{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.p-score .ring{width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:'Archivo';font-weight:800;font-size:21px;color:#fff}
.p-name{font-family:'Archivo';font-weight:700;font-size:21px;line-height:1.15;letter-spacing:-.4px}
.p-meta{font-size:12.5px;color:var(--muted);margin-top:5px}
.p-body{overflow-y:auto;flex:1;padding:22px 26px 36px}
.p-body::-webkit-scrollbar{width:8px}.p-body::-webkit-scrollbar-thumb{background:#d3d9e2;border-radius:8px}
.p-sec{margin-bottom:26px}
.p-sec h4{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.kpi .v{font-family:'Archivo';font-weight:700;font-size:18px}
.kpi .l{font-size:11px;color:var(--muted);margin-top:3px}

.bd-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.bd-row .lab{width:108px;flex:none;font-size:12.5px;color:var(--ink)}
.bd-row .track{flex:1;height:8px;background:#eef1f5;border-radius:8px;overflow:hidden}
.bd-row .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:8px}
.bd-row .pts{width:48px;flex:none;text-align:right;font-family:'IBM Plex Mono';font-size:12px;color:var(--muted)}
.notenriched{font-size:13px;color:var(--muted);line-height:1.5;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:14px}

.contact{display:flex;flex-direction:column;gap:8px}
.contact a,.contact span{font-size:13.5px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:9px}
.contact .ic{width:16px;color:var(--accent);font-size:13px}
.contact .none{color:var(--faint);font-style:italic}

.status-switch{display:flex;flex-wrap:wrap;gap:7px}
.ss-btn{font-size:12px;font-weight:600;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
  background:#fff;cursor:pointer;color:var(--muted);transition:.13s;display:flex;align-items:center;gap:7px}
.ss-btn:hover{border-color:var(--faint)}
.ss-btn.on{color:#fff;border-color:transparent}
.ss-btn.on[data-s=ny]{background:var(--st-ny)} .ss-btn.on[data-s=kontaktad]{background:var(--st-kontaktad)}
.ss-btn.on[data-s=mote]{background:var(--st-mote)} .ss-btn.on[data-s=ejaktuell]{background:var(--st-ej)}
.ss-btn .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

textarea,.dateinput{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-family:inherit;font-size:13px;resize:vertical;background:var(--surface-2);transition:.15s}
textarea{min-height:74px}
textarea:focus,.dateinput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.fu-label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:14px 0 6px;letter-spacing:.3px}
.quickdates{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qd-btn{font-size:11.5px;padding:6px 10px}
.notes-foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 15px;border-radius:9px;cursor:pointer;border:none;transition:.14s}
.btn-prim{background:var(--ink);color:#fff} .btn-prim:hover{background:#000}
.btn-acc{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#062a20;width:100%;justify-content:center;
  display:flex;align-items:center;gap:8px;padding:12px} .btn-acc:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted)} .btn-ghost:hover{border-color:var(--faint);color:var(--ink)}
.saved{font-size:12px;color:var(--accent);opacity:0;transition:.2s}.saved.show{opacity:1}

.outreach{margin-top:13px;display:none}
.outreach.show{display:block;animation:fade .25s}
.outreach .tag{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--hot);
  display:inline-flex;align-items:center;gap:6px;margin-bottom:9px}
#outreachText{min-height:170px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{display:none}}

/* ---------- Auth gate ---------- */
#authGate{position:fixed;inset:0;z-index:200;display:none;place-items:center;
  background:linear-gradient(160deg,var(--navy-800),var(--navy-900))}
#authGate.show{display:grid}
.auth-card{width:362px;max-width:90vw;background:var(--surface);border-radius:18px;padding:34px 32px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:fade .3s}
.auth-card .brand{justify-content:center;margin-bottom:10px}
.auth-card h2{font-family:'Archivo';font-weight:700;text-align:center;margin:4px 0 4px;font-size:20px;color:var(--ink)}
.auth-card p.lead{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:var(--surface-2)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.auth-err{color:var(--sc-low);font-size:12.5px;min-height:16px;margin:2px 0 10px}
.user-foot{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px}
.user-foot .av{width:30px;height:30px;border-radius:50%;background:rgba(0,179,136,.18);display:grid;place-items:center;
  font-size:12px;font-weight:600;color:var(--accent-2);flex:none;text-transform:uppercase}
.user-foot .em{font-size:11.5px;color:#9fb0cc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.user-foot .lo{font-size:11.5px;color:#c4cee0;cursor:pointer;background:none;border:1px solid rgba(255,255,255,.12);
  padding:5px 9px;border-radius:7px;font-family:inherit}
.user-foot .lo:hover{background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<div id="authGate">
  <div class="auth-card">
    <div class="brand"><div class="mark">A</div></div>
    <h2>Lead Machine</h2>
    <p class="lead">Logga in för att fortsätta</p>
    <div class="field"><label>E-post</label><input id="authEmail" type="email" autocomplete="username"></div>
    <div class="field"><label>Lösenord</label><input id="authPw" type="password" autocomplete="current-password"></div>
    <div class="auth-err" id="authErr"></div>
    <button class="btn btn-acc" id="authBtn">Logga in</button>
  </div>
</div>

<div class="app" id="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">A</div>
      <div class="wm">Lead Machine<small>AOTO · Lagerfinansiering</small></div>
    </div>

    <div class="stat-grid" id="stats"></div>

    <p class="section-label">Status</p>
    <div class="status-list" id="statusList"></div>

    <div class="slider-wrap">
      <div class="slider-head">
        <p class="section-label" style="margin:0">Min. score</p>
        <b class="num" id="scoreVal">0</b>
      </div>
      <input type="range" id="scoreSlider" min="0" max="100" value="0" step="5">
    </div>

    <div class="user-foot">
      <div class="av" id="userAv">–</div>
      <div class="em" id="userEmail">–</div>
      <button class="lo" id="logoutBtn">Logga ut</button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Bilhandlare</h1>
        <div class="sub"><span id="resultCount">0</span> leads · sorterade efter potential</div>
      </div>
      <div class="search">
        <span class="ic">⌕</span>
        <input id="search" placeholder="Sök företag, stad, org.nr…" autocomplete="off">
      </div>
      <button class="btn btn-ghost" id="importBtn" style="display:none;font-size:12px;padding:7px 13px">⬇ Importera från Roaring</button>
      <button class="btn btn-ghost" id="enrichBtn" style="display:none;font-size:12px;padding:7px 13px">⚙ Anrik 20 leads</button>
      <span class="conn-pill live" id="connPill"><span class="d"></span><span id="connText">Live · Supabase</span></span>
    </header>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th data-sort="score" class="right">Score</th>
            <th data-sort="company_name">Företag</th>
            <th data-sort="city">Stad</th>
            <th data-sort="revenue" class="right">Omsättning</th>
            <th data-sort="employees" class="right">Anställda</th>
            <th data-sort="follow_up_date">Uppföljning</th>
            <th data-sort="status">Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">Inga leads matchar filtren.</div>
    </div>
  </main>
</div>

<!-- ============ DETAIL PANEL ============ -->
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel">
  <div class="p-head">
    <button class="p-close" id="pClose">✕</button>
    <div class="p-score">
      <div class="ring" id="pRing">0</div>
      <div>
        <div class="p-name" id="pName">—</div>
        <div class="p-meta num" id="pMeta">—</div>
      </div>
    </div>
  </div>
  <div class="p-body" id="pBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. KONFIG
   ============================================================ */
const SUPABASE_URL  = "https://plydduphthqhpmwasznr.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBseWRkdXBodGhxaHBtd2Fzem5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTcxNjksImV4cCI6MjA5NjA5MzE2OX0.fdxR8DXxFjsT0f7fL0LamsNTj6WdFx5R_rFdi67SNWo";
let sb = null;

/* ============================================================
   2. SCORING
   ============================================================ */
function scoreBreakdown(l){
  if (l.org_nr == null) return { total:null, parts:[], notEnriched:true };

  // Omsättning: sweet spot 10–200 MSEK (max 35 p)
  const mskr = (l.revenue||0)/1e6;
  let oms = 0;
  if (mskr>=10 && mskr<=200) oms = mskr<=120 ? 35 : 35 - ((mskr-120)/80)*12;
  else if (mskr>0 && mskr<10) oms = (mskr/10)*17;
  oms = Math.max(0,Math.round(oms));

  // Anställda: 5–50 (max 25 p)
  const e = l.employees||0;
  let ans = 0;
  if (e>=5 && e<=50) ans = 25; else if (e>0 && e<5) ans = (e/5)*15; else if (e>50) ans = Math.max(8,25-(e-50)/8);
  ans = Math.round(ans);

  // Soliditet: låg soliditet = större finansieringsbehov (max 25 p)
  const s = l.solidity==null?40:l.solidity;
  let sol = s<=15 ? 25 : s<=30 ? 18 : s<=45 ? 11 : 4;

  // SNI bekräftad bilhandel, 47811 (max 15 p)
  const sni = (l.sni_code||"").trim()==="47811" ? 15 : 6;

  const parts = [
    {lab:"Omsättning", pts:oms, max:35},
    {lab:"Anställda",  pts:ans, max:25},
    {lab:"Soliditet",  pts:sol, max:25},
    {lab:"SNI / bransch", pts:sni, max:15},
  ];
  const total = parts.reduce((a,p)=>a+p.pts,0);
  return {total:Math.min(100,total), parts, notEnriched:false};
}

/* ============================================================
   3. STATE + HJÄLPARE
   ============================================================ */
let LEADS = [];
let sel = null;
let appReady = false;
const state = { status:"alla", minScore:0, q:"", sortKey:"score", sortDir:-1 };

const STATUS = {
  ny:        {label:"Ej kontaktad", cls:"b-ny",        col:"var(--st-ny)"},
  kontaktad: {label:"Kontaktad",    cls:"b-kontaktad", col:"var(--st-kontaktad)"},
  mote:      {label:"Möte bokat",   cls:"b-mote",      col:"var(--st-mote)"},
  ejaktuell: {label:"Ej intressant",cls:"b-ejaktuell", col:"var(--st-ej)"},
};
const $ = s => document.querySelector(s);
const fmtMSEK = v => v==null ? "–" : (v/1e6).toLocaleString("sv-SE",{maximumFractionDigits:1})+" MSEK";
const scoreColor = sc => sc>=80?"var(--sc-high)":sc>=50?"var(--sc-mid)":"var(--sc-low)";
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function followupInfo(d){
  if(!d) return {label:"–", cls:"fu-none"};
  const fmt = new Date(d+"T00:00:00").toLocaleDateString("sv-SE",{day:"numeric",month:"short"});
  if(d < todayStr())  return {label:`${fmt} · försenad`, cls:"fu-late"};
  if(d === todayStr()) return {label:`${fmt} · idag`,     cls:"fu-today"};
  return {label:fmt, cls:"fu-future"};
}

/* ============================================================
   4. DATA — Supabase
   ============================================================ */
async function loadLeads(){
  const { data, error } = await sb.from("leads").select("*");
  if(error) throw error;
  LEADS = data.map(d=>({...d, score:scoreBreakdown(d).total}));
}

async function patchLead(id, fields){
  const { error } = await sb.from("leads").update(fields).eq("id", id);
  if(error) console.error(error);
  return !error;
}

/* ============================================================
   5. FILTRERING + SORTERING
   ============================================================ */
function visible(){
  let r = LEADS.filter(l=>{
    if(state.status!=="alla" && l.status!==state.status) return false;
    if((l.score||0) < state.minScore) return false;
    if(state.q){
      const q=state.q.toLowerCase();
      if(!`${l.company_name} ${l.city} ${l.org_nr||""}`.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  const k=state.sortKey, d=state.sortDir;
  r.sort((a,b)=>{
    let x=a[k],y=b[k];
    if(k==="follow_up_date"){
      if(!x && !y) return 0;
      if(!x) return 1;
      if(!y) return -1;
      return x<y?-d:x>y?d:0;
    }
    if(typeof x==="string"){x=(x||"").toLowerCase();y=(y||"").toLowerCase();return x<y?-d:x>y?d:0;}
    return ((x||0)-(y||0))*d;
  });
  return r;
}

/* ============================================================
   6. RENDER
   ============================================================ */
function renderStats(){
  const mote = LEADS.filter(l=>l.status==="mote").length;
  const hot  = LEADS.filter(l=>l.score>=80 && l.status!=="ejaktuell").length;
  const fu   = LEADS.filter(l=>l.follow_up_date && l.follow_up_date<=todayStr() && l.status!=="ejaktuell").length;
  const unt  = LEADS.filter(l=>l.status==="ny" && l.score>=80).length;
  $("#stats").innerHTML = `
    <div class="stat mote"><span class="spark">📅</span><div class="v num">${mote}</div><div class="l">Möten bokade</div></div>
    <div class="stat hot"><span class="spark">🔥</span><div class="v num">${hot}</div><div class="l">Heta leads (80+)</div></div>
    <div class="stat followup"><span class="spark">⏰</span><div class="v num">${fu}</div><div class="l">Uppföljning idag/försenad</div></div>
    <div class="stat untouched"><span class="spark">✦</span><div class="v num">${unt}</div><div class="l">Orörda · score 80+</div></div>`;
}

function renderStatusFilter(){
  const counts = {alla:LEADS.length};
  Object.keys(STATUS).forEach(k=>counts[k]=LEADS.filter(l=>l.status===k).length);
  const item=(key,label,col)=>`
    <div class="status-item ${state.status===key?'active':''}" data-st="${key}">
      <span class="dot" style="background:${col}"></span>${label}
      <span class="cnt">${counts[key]||0}</span>
    </div>`;
  $("#statusList").innerHTML =
    item("alla","Alla leads","#7f8eaa") +
    Object.entries(STATUS).map(([k,v])=>item(k,v.label,v.col)).join("");
}

function renderTable(){
  const rows=visible();
  $("#resultCount").textContent=rows.length;
  const tb=$("#rows");
  $("#empty").style.display = rows.length?"none":"block";
  tb.innerHTML = rows.map(l=>{
    const st=STATUS[l.status]||STATUS.ny;
    const fu=followupInfo(l.follow_up_date);
    const scoreCell = l.score==null
      ? `<div class="score-cell"><span class="score-num" style="color:var(--faint)">–</span><span class="score-bar"><span class="score-fill" style="width:0%"></span></span></div>`
      : `<div class="score-cell"><span class="score-num" style="color:${scoreColor(l.score)}">${l.score}</span><span class="score-bar"><span class="score-fill" style="width:${l.score}%;background:${scoreColor(l.score)}"></span></span></div>`;
    return `<tr data-id="${l.id}" class="${sel&&sel.id===l.id?'sel':''}">
      <td class="right">${scoreCell}</td>
      <td><div class="co-name">${l.company_name}</div><div class="co-org num">${l.org_nr||"org.nr ej hämtat"}</div></td>
      <td>${l.city||"–"}</td>
      <td class="right num">${fmtMSEK(l.revenue)}</td>
      <td class="right num">${l.employees??"–"}</td>
      <td><span class="${fu.cls}">${fu.label}</span></td>
      <td><span class="badge ${st.cls}"><span class="dot"></span>${st.label}</span></td>
    </tr>`;
  }).join("");
  tb.querySelectorAll("tr").forEach(tr=>tr.onclick=()=>openPanel(+tr.dataset.id));
}

function renderAll(){renderStats();renderStatusFilter();renderTable();}

/* ============================================================
   7. DETALJPANEL
   ============================================================ */
function openPanel(id){
  sel = LEADS.find(l=>l.id===id); if(!sel) return;
  const bd = scoreBreakdown(sel), st = STATUS[sel.status]||STATUS.ny;

  $("#pRing").textContent= sel.score==null ? "–" : sel.score;
  $("#pRing").style.background= sel.score==null ? "#cfd6e2" : `conic-gradient(${scoreColor(sel.score)} ${sel.score*3.6}deg, #eef1f5 0deg)`;
  $("#pRing").style.boxShadow=`inset 0 0 0 6px #fff`;
  $("#pName").textContent=sel.company_name;
  $("#pMeta").textContent=`${sel.org_nr||"Org.nr ej hämtat"} · ${sel.city||"–"} · SNI ${sel.sni_code||"–"}`;

  const breakdownHtml = bd.notEnriched
    ? `<div class="notenriched">Det här bolaget är inte anrikat ännu. Klicka "⚙ Anrik 20 leads" i toppmenyn för att hämta org.nr, SNI-kod, antal anställda, omsättning och soliditet.</div>`
    : bd.parts.map(p=>`<div class="bd-row">
        <span class="lab">${p.lab}</span>
        <span class="track"><span class="fill" style="width:${(p.pts/p.max)*100}%"></span></span>
        <span class="pts">${p.pts}/${p.max}</span>
      </div>`).join("");

  $("#pBody").innerHTML = `
    <div class="p-sec">
      <h4>Varför den här poängen</h4>
      ${breakdownHtml}
    </div>

    <div class="p-sec">
      <h4>Nyckeltal</h4>
      <div class="kpis">
        <div class="kpi"><div class="v num">${fmtMSEK(sel.revenue)}</div><div class="l">Omsättning</div></div>
        <div class="kpi"><div class="v num">${sel.employees??"–"}</div><div class="l">Anställda</div></div>
        <div class="kpi"><div class="v num">${sel.solidity!=null?sel.solidity+" %":"–"}</div><div class="l">Soliditet</div></div>
        <div class="kpi"><div class="v num">${sel.sni_code||"–"}</div><div class="l">SNI-kod</div></div>
      </div>
    </div>

    <div class="p-sec">
      <h4>Kontakt</h4>
      <div class="contact">
        ${sel.contact_name?`<span><span class="ic">👤</span>${sel.contact_name}</span>`:`<span class="none"><span class="ic">👤</span>Ingen kontaktperson</span>`}
        ${sel.contact_phone?`<a href="tel:${sel.contact_phone}"><span class="ic">📞</span>${sel.contact_phone}</a>`:""}
        ${sel.contact_email?`<a href="mailto:${sel.contact_email}"><span class="ic">✉</span>${sel.contact_email}</a>`:""}
      </div>
    </div>

    <div class="p-sec">
      <h4>Status</h4>
      <div class="status-switch" id="ssw">
        ${Object.entries(STATUS).map(([k,v])=>`<button class="ss-btn ${sel.status===k?'on':''}" data-s="${k}"><span class="dot"></span>${v.label}</button>`).join("")}
      </div>
    </div>

    <div class="p-sec">
      <h4>Anteckningar & uppföljning</h4>
      <textarea id="notes" placeholder="Skriv anteckningar om leaden…">${sel.notes||""}</textarea>
      <label class="fu-label">Nästa uppföljning</label>
      <input type="date" id="followup" class="dateinput" value="${sel.follow_up_date||""}">
      <div class="quickdates">
        <button class="btn btn-ghost qd-btn" data-days="1">Imorgon</button>
        <button class="btn btn-ghost qd-btn" data-days="7">+1 vecka</button>
        <button class="btn btn-ghost qd-btn" data-days="30">+1 månad</button>
        <button class="btn btn-ghost qd-btn" data-days="clear">Rensa</button>
      </div>
      <div class="notes-foot">
        <button class="btn btn-prim" id="saveNotes">Spara</button>
        <span class="saved" id="savedMsg">✓ Sparat</span>
      </div>
    </div>

    <div class="p-sec" style="margin-bottom:0">
      <h4>Första kontakt</h4>
      <button class="btn btn-acc" id="genBtn">✨ Generera kontaktmeddelande</button>
      <div class="outreach" id="outreachWrap">
        <span class="tag">⚡ Utkast · redigerbart</span>
        <textarea id="outreachText"></textarea>
        <div class="notes-foot">
          <button class="btn btn-prim" id="sendBtn">✉ Öppna i Outlook</button>
        </div>
      </div>
    </div>`;

  // status-switch
  $("#ssw").querySelectorAll(".ss-btn").forEach(b=>b.onclick=async()=>{
    const ns=b.dataset.s; if(ns===sel.status) return;
    const ok=await patchLead(sel.id,{status:ns,updated_at:new Date().toISOString()});
    if(ok){sel.status=ns;openPanel(sel.id);renderAll();toast("Status uppdaterad");}
    else toast("Kunde inte uppdatera status");
  });

  // snabbval för uppföljningsdatum
  $("#pBody").querySelectorAll("[data-days]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.days;
    if(v==="clear"){ $("#followup").value=""; return; }
    const d=new Date(); d.setDate(d.getDate()+(+v));
    $("#followup").value = d.toISOString().slice(0,10);
  });

  // spara anteckning + uppföljning
  $("#saveNotes").onclick=async()=>{
    const v=$("#notes").value;
    const fu=$("#followup").value || null;
    const ok=await patchLead(sel.id,{notes:v, follow_up_date:fu, updated_at:new Date().toISOString()});
    if(ok){
      sel.notes=v; sel.follow_up_date=fu;
      const m=$("#savedMsg");m.classList.add("show");setTimeout(()=>m.classList.remove("show"),1600);
      renderAll();
    } else toast("Kunde inte spara");
  };

  // generera + skicka via Outlook
  $("#genBtn").onclick=()=>{
    const msg =
`Hej${sel.contact_name?` ${sel.contact_name.split(" ")[0]}`:""}!

Jag heter [Ditt namn] och jobbar på AOTO. Jag ser att ${sel.company_name} i ${sel.city||"er region"} skulle kunna frigöra rörelsekapital genom lagerfinansiering av begagnade bilar – ni betalar bara för det lager ni faktiskt har ute.

Har du 15 minuter nästa vecka för ett kort samtal om hur det skulle se ut för er?

Vänliga hälsningar,
[Ditt namn], AOTO`;
    $("#outreachText").value = msg;
    $("#outreachWrap").classList.add("show");
    $("#outreachWrap").scrollIntoView({behavior:"smooth",block:"nearest"});
  };
  $("#sendBtn").onclick=()=>{
    const subject = encodeURIComponent(`AOTO – lagerfinansiering för ${sel.company_name}`);
    const body = encodeURIComponent($("#outreachText").value);
    const to = sel.contact_email || "";
    window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
  };

  $("#panel").classList.add("open");$("#scrim").classList.add("open");
  renderTable();
}
function closePanel(){$("#panel").classList.remove("open");$("#scrim").classList.remove("open");sel=null;renderTable();}

/* ============================================================
   8. EVENTS
   ============================================================ */
$("#statusList").onclick=e=>{const it=e.target.closest(".status-item");if(!it)return;state.status=it.dataset.st;renderStatusFilter();renderTable();};
$("#scoreSlider").oninput=e=>{state.minScore=+e.target.value;$("#scoreVal").textContent=e.target.value;
  e.target.style.setProperty("--p",e.target.value+"%");renderTable();};
$("#search").oninput=e=>{state.q=e.target.value.trim();renderTable();};
$("#pClose").onclick=closePanel;$("#scrim").onclick=closePanel;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel();});
document.querySelectorAll("thead th[data-sort]").forEach(th=>th.onclick=()=>{
  const k=th.dataset.sort;
  if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=(k==="company_name"||k==="city"||k==="status"||k==="follow_up_date")?1:-1;}
  document.querySelectorAll("thead th .ar").forEach(a=>a.remove());
  const ar=document.createElement("span");ar.className="ar";ar.textContent=state.sortDir>0?"▲":"▼";th.appendChild(ar);
  renderTable();
});

/* ============================================================
   9. AUTH + INIT
   ============================================================ */
const appEl = $("#app");
function showApp(){ appEl.style.display="grid"; $("#authGate").classList.remove("show"); }
function showGate(){ appEl.style.display="none"; $("#authGate").classList.add("show"); appReady=false; LEADS=[]; closePanel(); }

async function enterApp(session){
  showApp();
  const email = session?.user?.email || "";
  $("#userEmail").textContent = email;
  $("#userAv").textContent = (email[0]||"–");
  if(appReady) return;
  appReady = true;
  try{ await loadLeads(); renderAll(); }
  catch(err){ console.error(err); toast("Kunde inte hämta leads – kontrollera RLS-policy"); }
}

async function doLogin(){
  const email = $("#authEmail").value.trim();
  const pw = $("#authPw").value;
  const btn = $("#authBtn"); const err = $("#authErr");
  err.textContent="";
  if(!email||!pw){ err.textContent="Fyll i e-post och lösenord."; return; }
  btn.disabled=true; btn.textContent="Loggar in…";
  const { error } = await sb.auth.signInWithPassword({ email, password:pw });
  btn.disabled=false; btn.textContent="Logga in";
  if(error){ err.textContent = "Fel e-post eller lösenord."; }
}

(async function boot(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  $("#authBtn").onclick = doLogin;
  $("#authPw").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  $("#authEmail").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#authPw").focus(); });
  $("#logoutBtn").onclick = ()=> sb.auth.signOut();

  const importBtn = $("#importBtn"); importBtn.style.display="";
  importBtn.onclick = async ()=>{
    importBtn.disabled=true; importBtn.textContent="Importerar…";
    try{
      const {data:{session:s}} = await sb.auth.getSession();
      if(!s) { toast("Du måste vara inloggad"); return; }
      const res = await fetch("/.netlify/functions/roaring-import",{
        method:"POST",
        headers:{ Authorization:"Bearer "+s.access_token }
      });
      const body = await res.json();
      if(body.success){ toast(body.message); await loadLeads(); renderAll(); }
      else { toast("Import misslyckades: "+(body.error||res.status)); }
    }catch(err){ console.error(err); toast("Import-fel: "+err.message); }
    finally{ importBtn.disabled=false; importBtn.textContent="⬇ Importera från Roaring"; }
  };

  const enrichBtn = $("#enrichBtn"); enrichBtn.style.display="";
  enrichBtn.onclick = async ()=>{
    enrichBtn.disabled=true; enrichBtn.textContent="Anrikar…";
    try{
      const {data:{session:s}} = await sb.auth.getSession();
      if(!s) { toast("Du måste vara inloggad"); return; }
      const res = await fetch("/.netlify/functions/roaring-enrich",{
        method:"POST",
        headers:{ Authorization:"Bearer "+s.access_token }
      });
      const body = await res.json();
      if(body.success){ toast(body.message); await loadLeads(); renderAll(); }
      else { toast("Anrikning misslyckades: "+(body.error||res.status)); }
    }catch(err){ console.error(err); toast("Anrik-fel: "+err.message); }
    finally{ enrichBtn.disabled=false; enrichBtn.textContent="⚙ Anrik 20 leads"; }
  };

  const { data:{ session } } = await sb.auth.getSession();
  if(session) enterApp(session); else showGate();

  sb.auth.onAuthStateChange((event, s)=>{
    if(event==="SIGNED_IN" && s) enterApp(s);
    if(event==="SIGNED_OUT") showGate();
  });
})();
</script>
